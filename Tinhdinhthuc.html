<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đề Thi Trắc Nghiệm Định Thức Ma Trận</title>

<!-- MathJax -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']]
  }
};
</script>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
    line-height:1.6;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#0b5394;
}

.question{
    margin-top:30px;
    padding:20px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fafafa;
}

.question h3{
    margin-top:0;
}

.option{
    display:block;
    margin:10px 0;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    cursor:pointer;
    transition:0.3s;
}

.option:hover{
    background:#eef5ff;
}

.correct{
    background:#b7ffb7 !important;
    border:2px solid green;
}

.wrong{
    background:#ffbcbc !important;
    border:2px solid red;
}

.explanation{
    margin-top:15px;
    padding:15px;
    background:#eef7ff;
    border-left:5px solid #0b5394;
    display:none;
}

.score-box{
    position:sticky;
    top:0;
    background:#0b5394;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    border-radius:10px;
    margin-bottom:20px;
    z-index:999;
}

button{
    padding:12px 20px;
    border:none;
    background:#0b5394;
    color:white;
    border-radius:8px;
    cursor:pointer;
    margin-top:30px;
    font-size:18px;
}

button:hover{
    background:#073763;
}

.level{
    color:#cc0000;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<h1>ĐỀ THI TRẮC NGHIỆM ĐỊNH THỨC MA TRẬN</h1>

<div class="score-box">
Điểm: <span id="score">0</span> / 20
</div>

<div id="quiz"></div>

<center>
<button onclick="location.reload()">Làm lại bài</button>
</center>

</div>

<script>

const questions = [

/* =========================
5 CÂU LÝ THUYẾT
========================= */

{
type:"Lý thuyết",
q:"1. Định thức của ma trận \\(2 \\times 2\\) biểu diễn điều gì về hình học?",
options:[
"Chu vi hình chữ nhật",
"Diện tích hình bình hành",
"Độ dài vector",
"Khoảng cách hai điểm"
],
answer:1,
explanation:"Định thức của ma trận \\(2 \\times 2\\) biểu diễn diện tích hình bình hành tạo bởi hai vector cột.",
tip:"Nhớ câu thần chú: định thức cấp 2 = diện tích."
},

{
type:"Lý thuyết",
q:"2. Nếu \\(\\det(A)=0\\) thì điều gì xảy ra?",
options:[
"Ma trận khả nghịch",
"Không gian bị phóng to",
"Ma trận không có nghịch đảo",
"Ma trận luôn là đơn vị"
],
answer:2,
explanation:"Nếu định thức bằng 0 thì ma trận làm bẹp không gian nên không thể đảo ngược.",
tip:"\\(\\det(A)=0\\) ⇔ ma trận suy biến."
},

{
type:"Lý thuyết",
q:"3. Công thức định thức ma trận \\(2 \\times 2\\) là gì?",
options:[
"\\(ab+cd\\)",
"\\(ad-bc\\)",
"\\(ac-bd\\)",
"\\(ad+bc\\)"
],
answer:1,
explanation:"Định thức ma trận cấp 2 được tính bằng đường chéo chính trừ đường chéo phụ.",
tip:"Chính trừ phụ."
},

{
type:"Lý thuyết",
q:"4. Tính chất đúng là:",
options:[
"\\(\\det(AB)=\\det(A)+\\det(B)\\)",
"\\(\\det(AB)=\\det(A)\\det(B)\\)",
"\\(\\det(A^{-1})=\\det(A)\\)",
"\\(\\det(I)=0\\)"
],
answer:1,
explanation:"Định thức của tích bằng tích các định thức.",
tip:"Biến đổi ghép ⇒ thể tích nhân."
},

{
type:"Lý thuyết",
q:"5. Ma trận tam giác trên có định thức bằng:",
options:[
"Tổng đường chéo",
"Tích đường chéo chính",
"Hiệu đường chéo",
"0"
],
answer:1,
explanation:"Định thức ma trận tam giác bằng tích các phần tử trên đường chéo chính.",
tip:"Tam giác ⇒ nhân đường chéo."
},

/* =========================
5 CÂU DỄ
========================= */

{
type:"Dễ",
q:"6. Tính \\(\\det\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}\\)",
options:[
"-2",
"2",
"10",
"5"
],
answer:0,
explanation:"\\(1\\cdot4-2\\cdot3=4-6=-2\\)",
tip:"Lấy đường chéo chính trừ phụ."
},

{
type:"Dễ",
q:"7. Tính \\(\\det\\begin{pmatrix}2&0\\\\0&5\\end{pmatrix}\\)",
options:[
"10",
"7",
"5",
"0"
],
answer:0,
explanation:"\\(2\\cdot5-0=10\\)",
tip:"Ma trận chéo ⇒ nhân các số trên đường chéo."
},

{
type:"Dễ",
q:"8. Nếu \\(\\det(A)=3\\), \\(\\det(B)=2\\) thì \\(\\det(AB)=?\\)",
options:[
"5",
"6",
"1",
"9"
],
answer:1,
explanation:"\\(\\det(AB)=3\\times2=6\\)",
tip:"Nhớ công thức tích định thức."
},

{
type:"Dễ",
q:"9. Tính \\(\\det\\begin{pmatrix}4&1\\\\2&3\\end{pmatrix}\\)",
options:[
"10",
"12",
"5",
"8"
],
answer:0,
explanation:"\\(4\\cdot3-1\\cdot2=12-2=10\\)",
tip:"Chính trừ phụ."
},

{
type:"Dễ",
q:"10. Ma trận nào sau đây có định thức bằng 0?",
options:[
"\\(\\begin{pmatrix}1&2\\\\2&4\\end{pmatrix}\\)",
"\\(\\begin{pmatrix}1&0\\\\0&1\\end{pmatrix}\\)",
"\\(\\begin{pmatrix}2&1\\\\3&4\\end{pmatrix}\\)",
"\\(\\begin{pmatrix}5&2\\\\1&1\\end{pmatrix}\\)"
],
answer:0,
explanation:"Hai hàng tỉ lệ nên định thức bằng 0.",
tip:"Hàng hoặc cột tỉ lệ ⇒ det = 0."
},

/* =========================
5 CÂU TRUNG BÌNH
========================= */

{
type:"Trung bình",
q:"11. Tính \\(\\det\\begin{pmatrix}1&2&3\\\\0&1&4\\\\0&0&2\\end{pmatrix}\\)",
options:[
"2",
"8",
"6",
"4"
],
answer:0,
explanation:"Ma trận tam giác trên ⇒ \\(1\\times1\\times2=2\\)",
tip:"Tam giác ⇒ nhân đường chéo."
},

{
type:"Trung bình",
q:"12. Nếu đổi chỗ hai hàng của ma trận thì định thức:",
options:[
"Không đổi",
"Đổi dấu",
"Nhân đôi",
"Bằng 0"
],
answer:1,
explanation:"Đổi hai hàng làm định thức đổi dấu.",
tip:"Swap hàng ⇒ đổi dấu."
},

{
type:"Trung bình",
q:"13. Nếu một hàng toàn số 0 thì định thức:",
options:[
"1",
"Âm",
"0",
"Dương"
],
answer:2,
explanation:"Hàng bằng 0 làm thể tích bằng 0.",
tip:"Không gian bị bẹp."
},

{
type:"Trung bình",
q:"14. Tính \\(\\det\\begin{pmatrix}3&1\\\\5&2\\end{pmatrix}\\)",
options:[
"1",
"6",
"5",
"4"
],
answer:0,
explanation:"\\(3\\cdot2-1\\cdot5=6-5=1\\)",
tip:"Chính trừ phụ."
},

{
type:"Trung bình",
q:"15. Nếu \\(\\det(A)=5\\) thì \\(\\det(A^{-1})=?\\)",
options:[
"5",
"-5",
"\\(\\frac{1}{5}\\)",
"0"
],
answer:2,
explanation:"\\(\\det(A^{-1})=1/\\det(A)\\)",
tip:"Ma trận nghịch đảo ⇒ nghịch đảo định thức."
},

/* =========================
5 CÂU KHÓ
========================= */

{
type:"Khó",
q:"16. Tính \\(\\det\\begin{pmatrix}2&1&1\\\\4&3&2\\\\-2&1&2\\end{pmatrix}\\)",
options:[
"6",
"4",
"2",
"8"
],
answer:0,
explanation:"Biến đổi Gauss đưa về tam giác trên rồi nhân đường chéo được 6.",
tip:"Khử Gauss nhanh hơn khai triển."
},

{
type:"Khó",
q:"17. Nếu \\(\\det(A)=2\\), \\(\\det(B)=-3\\), tìm \\(\\det(B^{-1}A)\\)",
options:[
"-6",
"-\\(\\frac{2}{3}\\)",
"6",
"\\(\\frac{3}{2}\\)"
],
answer:1,
explanation:"\\(\\det(B^{-1}A)=\\det(B^{-1})\\det(A)=\\frac{1}{-3}\\times2=-\\frac{2}{3}\\)",
tip:"Đổi nghịch đảo ⇒ lấy nghịch đảo định thức."
},

{
type:"Khó",
q:"18. Nếu hai cột của ma trận phụ thuộc tuyến tính thì:",
options:[
"Định thức khác 0",
"Định thức bằng 1",
"Định thức bằng 0",
"Không kết luận được"
],
answer:2,
explanation:"Các vector phụ thuộc tuyến tính ⇒ không gian bị bẹp ⇒ định thức bằng 0.",
tip:"Phụ thuộc tuyến tính ⇒ det = 0."
},

{
type:"Khó",
q:"19. Tính \\(\\det\\begin{pmatrix}1&0&2\\\\0&3&1\\\\4&0&1\\end{pmatrix}\\)",
options:[
"-21",
"21",
"15",
"-15"
],
answer:0,
explanation:"Khai triển theo cột 2: \\(3\\cdot\\det\\begin{pmatrix}1&2\\\\4&1\\end{pmatrix}=3(1-8)=3(-7)=-21\\)",
tip:"Khai triển theo hàng/cột có nhiều số 0."
},

{
type:"Khó",
q:"20. Ý nghĩa sâu xa nhất của định thức là gì?",
options:[
"Một phép cộng số",
"Hệ số phóng đại thể tích của phép biến đổi tuyến tính",
"Một dạng phương trình",
"Một phép chia"
],
answer:1,
explanation:"Định thức cho biết phép biến đổi tuyến tính làm không gian phóng to hay co lại bao nhiêu lần.",
tip:"Hãy nghĩ tới diện tích và thể tích."
}

];

const quiz = document.getElementById("quiz");
let score = 0;

questions.forEach((q,index)=>{

    const div = document.createElement("div");
    div.className="question";

    div.innerHTML=`
        <h3>Câu ${index+1} <span class="level">(${q.type})</span></h3>
        <p>${q.q}</p>
    `;

    q.options.forEach((opt,i)=>{

        const btn=document.createElement("div");
        btn.className="option";
        btn.innerHTML=opt;

        btn.onclick=function(){

            if(div.classList.contains("answered")) return;

            div.classList.add("answered");

            if(i===q.answer){
                btn.classList.add("correct");
                score++;
                document.getElementById("score").innerText=score;
            }else{
                btn.classList.add("wrong");
                div.querySelectorAll(".option")[q.answer].classList.add("correct");
            }

            exp.style.display="block";

            MathJax.typeset();
        };

        div.appendChild(btn);

    });

    const exp=document.createElement("div");
    exp.className="explanation";
    exp.innerHTML=`
        <b>Đáp án đúng:</b> ${q.options[q.answer]}<br><br>
        <b>Giải thích:</b> ${q.explanation}<br><br>
        <b>Mẹo làm nhanh:</b> ${q.tip}
    `;

    div.appendChild(exp);

    quiz.appendChild(div);

});

MathJax.typeset();

</script>

</body>
</html>
